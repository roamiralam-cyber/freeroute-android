
name: FreeRoute Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build FreeRoute APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FreeRoute
        uses: actions/checkout@v4

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          path: sing-box

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        run: |
          sdkmanager "ndk;28.0.13004108"
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> $GITHUB_ENV

      - name: Build sing-box Android libraries
        working-directory: sing-box
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> $GITHUB_PATH
          go run ./cmd/internal/build_libbox -target android

      - name: Prepare Android libraries
        run: |
          mkdir -p app/libs
          cp sing-box/libbox.aar app/libs/
          cp sing-box/libbox-legacy.aar app/libs/
          test -s app/libs/libbox.aar
          test -s app/libs/libbox-legacy.aar

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleOtherDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoute-Debug-APK
          path: app/build/outputs/apk/other/debug/*.apk
          if-no-files-found: error
          retention-days: 7
