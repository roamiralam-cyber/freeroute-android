
name: FreeRoute Android Build

on:
  workflow_dispatch:
  push:
    branches:
      - dev

permissions:
  contents: read

jobs:
  build:
    name: Build FreeRoute APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout FreeRoute
        uses: actions/checkout@v4
        with:
          path: freeroute

      - name: Checkout sing-box core
        uses: actions/checkout@v4
        with:
          repository: SagerNet/sing-box
          ref: v1.15.0-alpha.13
          path: sing-box

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: sing-box/go.mod
          cache: false

      - name: Setup Android SDK
        run: |
          set -e
          SDK="${ANDROID_HOME:-${ANDROID_SDK_ROOT}}"
          echo "ANDROID_HOME=$SDK" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK" >> "$GITHUB_ENV"

          SDKMANAGER="$SDK/cmdline-tools/latest/bin/sdkmanager"

          yes | "$SDKMANAGER" --licenses >/dev/null || true

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-37.1" \
            "build-tools;37.0.0" \
            "ndk;28.0.13004108"

      - name: Setup Android NDK
        run: |
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/28.0.13004108" >> "$GITHUB_ENV"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install gomobile
        run: |
          go install github.com/sagernet/gomobile/cmd/gomobile@v0.1.13
          go install github.com/sagernet/gomobile/cmd/gobind@v0.1.13
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"

      - name: Build sing-box libraries
        working-directory: sing-box
        run: |
          go run ./cmd/internal/build_libbox -target android
          test -s libbox.aar
          test -s libbox-legacy.aar

      - name: Prepare Android libraries
        run: |
          mkdir -p freeroute/app/libs
          cp sing-box/libbox.aar freeroute/app/libs/
          cp sing-box/libbox-legacy.aar freeroute/app/libs/

      - name: Build Debug APK
        working-directory: freeroute
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :app:assembleOtherDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: FreeRoute-Debug-APK
          path: freeroute/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7
